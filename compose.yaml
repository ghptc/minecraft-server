services:
  minecraft:
    image: itzg/minecraft-server:java25
    restart: unless-stopped
    ports:
      - "25565:25565/tcp"
    environment:
      EULA: "TRUE"
      TYPE: PAPER
      VERSION: "26.3"
      PAPER_BUILD: "135"
      MEMORY: "10G"
      MAX_PLAYERS: "5"
      ONLINE_MODE: "FALSE"
      ENABLE_WHITELIST: "TRUE"
      ENFORCE_WHITELIST: "TRUE" 
      ENABLE_RCON: "FALSE"
      VIEW_DISTANCE: "24"
      SIMULATION_DISTANCE: "8"
      CREATE_CONSOLE_IN_PIPE: "TRUE"
    volumes:
      - ./data:/data
    stop_grace_period: 2m
    mem_limit: 12g
  watcher:
    image: ghcr.io/ghptc/minecraft-watcher:1.0.1
    restart: unless-stopped
    environment:
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:?required}
    volumes:
      - ./data/logs:/logs:ro
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m

