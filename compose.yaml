services:
  minecraft:
    image: itzg/minecraft-server:java25
    restart: unless-stopped
    ports:
      - "25565:25565/tcp"
    environment:
      EULA: "TRUE"
      TYPE: PAPER
      VERSION: "26.3"
      PAPER_BUILD: "135"
      MEMORY: "10G"
      MAX_PLAYERS: "5"
      ONLINE_MODE: "FALSE"
      ENABLE_WHITELIST: "FALSE"
      ENFORCE_WHITELIST: "FALSE"
      ENABLE_RCON: "FALSE"
      VIEW_DISTANCE: "20"
      SIMULATION_DISTANCE: "8"
    volumes:
      - ./data:/data
    stop_grace_period: 2m
    mem_limit: 12g

